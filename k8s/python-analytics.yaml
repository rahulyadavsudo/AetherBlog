apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-analytics
  namespace: aetherblog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-analytics
  template:
    metadata:
      labels:
        app: python-analytics
    spec:
      containers:
        - name: python-analytics
          image: raaahulyadav/aetherblog-python-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: python-analytics
  namespace: aetherblog
spec:
  type: ClusterIP
  selector:
    app: python-analytics
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
