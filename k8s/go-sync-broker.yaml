apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-sync-broker
  namespace: aetherblog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-sync-broker
  template:
    metadata:
      labels:
        app: go-sync-broker
    spec:
      containers:
        - name: go-sync-broker
          image: raaahulyadav/aetherblog-go-sync-broker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: go-sync-broker
  namespace: aetherblog
spec:
  type: ClusterIP
  selector:
    app: go-sync-broker
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
