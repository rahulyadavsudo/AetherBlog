apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-crypto-engine
  namespace: aetherblog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-crypto-engine
  template:
    metadata:
      labels:
        app: rust-crypto-engine
    spec:
      containers:
        - name: rust-crypto-engine
          image: raaahulyadav/aetherblog-rust-crypto-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rust-crypto-engine
  namespace: aetherblog
spec:
  type: ClusterIP
  selector:
    app: rust-crypto-engine
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
