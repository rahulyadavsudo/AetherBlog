services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    image: aetherblog-frontend:latest
    container_name: aetherblog-frontend
    ports:
      - "3000:80"
    depends_on:
      go_sync_broker:
        condition: service_healthy
      rust_crypto_engine:
        condition: service_healthy
      python_analytics:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  go_sync_broker:
    build:
      context: ./microservices/go_sync_broker
      dockerfile: Dockerfile
    image: aetherblog-go-sync-broker:latest
    container_name: aetherblog-go-sync-broker
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  rust_crypto_engine:
    build:
      context: ./microservices/rust_crypto_engine
      dockerfile: Dockerfile
    image: aetherblog-rust-crypto-engine:latest
    container_name: aetherblog-rust-crypto-engine
    ports:
      - "8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  python_analytics:
    build:
      context: ./microservices/python_analytics
      dockerfile: Dockerfile
    image: aetherblog-python-analytics:latest
    container_name: aetherblog-python-analytics
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
